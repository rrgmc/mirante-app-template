# Builds, tests and packages this app with the core's workflows. A push to the
# default branch that raised MIRANTE_VERSION in CMakeLists.txt publishes the
# release vX.Y.Z, as a merged update does, and so does a pushed tag vX.Y.Z or
# vX.Y.Z-rc.N. The refs below must match the core's ref in mirante.json.

name: Build
# Pull request runs lead with the number, and a pushed tag's run is titled
# "Release vX.Y.Z". Other runs keep GitHub's default title, because an empty
# run-name means the default.
run-name: ${{ github.event_name == 'pull_request' && format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || github.ref_type == 'tag' && format('Release {0}', github.ref_name) || '' }}

on:
  push:
    branches: [master]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
  # A pull request in the merge queue is checked again on top of master, so
  # that branches need not be brought up to date by hand. See decision 0154
  # in mirante-core.
  merge_group:

concurrency:
  group: build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    uses: rrgmc/mirante-core/.github/workflows/build-app.yml@v0.8.0
    with:
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      # The template itself publishes nothing.
      release-new-version: ${{ !github.event.repository.is_template }}
      # The optional modules of mirante.json to build, separated by spaces,
      # such as: claude github gitlab jira
      enable-modules: ''

  publish:
    needs: build
    if: needs.build.outputs.release-tag != ''
    permissions:
      contents: write
    uses: rrgmc/mirante-core/.github/workflows/release-app.yml@v0.8.0
    with:
      tag: ${{ needs.build.outputs.release-tag }}
      edition: ${{ needs.build.outputs.edition }}
